openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient records
  - name: visits
    description: Medical visits
  - name: dashboard
    description: Clinic overview
  - name: owners
    description: Pet owners (responsables)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get clinic dashboard summary
      responses:
        "200":
          description: Dashboard totals and recent visits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List and search patients
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Patient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Invalid patient data
  /patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
    put:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "400":
          description: Invalid patient data
        "404":
          description: Patient not found
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete a patient and their visit history
      responses:
        "204":
          description: Patient and linked visits deleted
        "404":
          description: Patient not found
  /patients/{id}/visits:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listPatientVisits
      tags: [visits]
      summary: List a patient's medical history
      responses:
        "200":
          description: Visits ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"
        "404":
          description: Patient not found
  /visits:
    get:
      operationId: listVisits
      tags: [visits]
      summary: List medical visits
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
        - name: days
          in: query
          required: false
          description: Only visits from the last N clinic calendar days (today included)
          schema:
            type: integer
            minimum: 1
            maximum: 3650
      responses:
        "200":
          description: Visit list ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"
    post:
      operationId: createVisit
      tags: [visits]
      summary: Register a medical visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "201":
          description: Visit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "400":
          description: Invalid visit data
        "404":
          description: Patient not found
  /visits/export:
    get:
      operationId: exportVisitsCsv
      tags: [visits]
      summary: Export recent visits as CSV (pet, owner, date and reason)
      parameters:
        - name: days
          in: query
          required: false
          description: Last N clinic calendar days (today included). Defaults to 30.
          schema:
            type: integer
            minimum: 1
            maximum: 3650
            default: 30
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid parameters
  /visits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getVisit
      tags: [visits]
      summary: Get a medical visit
      responses:
        "200":
          description: Visit details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "404":
          description: Visit not found
    put:
      operationId: updateVisit
      tags: [visits]
      summary: Update a medical visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "200":
          description: Updated visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "400":
          description: Invalid visit data
        "404":
          description: Visit or patient not found
    delete:
      operationId: deleteVisit
      tags: [visits]
      summary: Delete a medical visit
      responses:
        "204":
          description: Visit deleted
        "404":
          description: Visit not found
  /owners:
    get:
      operationId: listOwners
      tags: [owners]
      summary: List owners with the pets they are responsible for
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Owner list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerSummary"
  /owners/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getOwner
      tags: [owners]
      summary: Get an owner and all of their pets
      responses:
        "200":
          description: Owner details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDetail"
        "404":
          description: Owner not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Patient:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        species: { type: string }
        breed: { type: string }
        age: { type: integer, minimum: 0 }
        sex: { type: string, enum: [female, male] }
        ownerName: { type: string, description: First owner (kept for compatibility) }
        ownerPhone: { type: string, description: Phone of the first owner (kept for compatibility) }
        owners:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
        createdAt: { type: string, format: date-time }
      required: [id, name, species, breed, age, sex, ownerName, ownerPhone, owners, createdAt]
    PatientInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        species: { type: string, minLength: 1 }
        breed: { type: string }
        age: { type: integer, minimum: 0 }
        sex: { type: string, enum: [female, male] }
        owners:
          type: array
          minItems: 1
          description: Owners of the pet. Required unless ownerName and ownerPhone are sent.
          items:
            $ref: "#/components/schemas/OwnerInput"
        ownerName: { type: string, minLength: 1, description: "Deprecated: use owners" }
        ownerPhone: { type: string, minLength: 1, description: "Deprecated: use owners" }
      required: [name, species, breed, age, sex]
    Visit:
      type: object
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        patientSpecies: { type: string }
        visitDate: { type: string, format: date-time }
        reason: { type: string }
        diagnosis: { type: string }
        treatment: { type: string }
        observations: { type: string }
        ownerNames: { type: string, description: Names of the pet's owners, comma separated }
        createdAt: { type: string, format: date-time }
      required: [id, patientId, patientName, patientSpecies, visitDate, reason, diagnosis, treatment, observations, ownerNames, createdAt]
    VisitInput:
      type: object
      properties:
        patientId: { type: integer, minimum: 1 }
        visitDate: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
        diagnosis: { type: string }
        treatment: { type: string }
        observations: { type: string }
      required: [patientId, visitDate, reason, diagnosis, treatment, observations]
    RecentVisit:
      type: object
      properties:
        id: { type: integer }
        patientId: { type: integer }
        patientName: { type: string }
        patientSpecies: { type: string }
        visitDate: { type: string, format: date-time }
        reason: { type: string }
      required: [id, patientId, patientName, patientSpecies, visitDate, reason]
    Owner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
      required: [id, name, phone]
    OwnerInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
      required: [name, phone]
    OwnerSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        patientCount: { type: integer }
        patientNames:
          type: array
          items: { type: string }
      required: [id, name, phone, patientCount, patientNames]
    OwnerDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        patients:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
      required: [id, name, phone, patients]
    DashboardSummary:
      type: object
      properties:
        totalPatients: { type: integer }
        totalVisits: { type: integer }
        visitsToday: { type: integer }
        recentVisits:
          type: array
          items:
            $ref: "#/components/schemas/RecentVisit"
      required: [totalPatients, totalVisits, visitsToday, recentVisits]

